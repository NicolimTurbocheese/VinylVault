<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VinylVault — Vinyl Record Scanner & Valuation</title>

    <!-- Installable-app metadata. Without a manifest and real icons, adding the app to a
         phone's home screen produced a blank/screenshot tile. Paths are relative because
         the app is served from a GitHub Pages subpath, not a domain root. -->
    <meta name="description" content="Scan, catalogue and value a vinyl record collection." />
    <meta name="theme-color" content="#A94A42" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <!-- iOS ignores the manifest for home-screen icons and uses this instead. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VinylVault" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
